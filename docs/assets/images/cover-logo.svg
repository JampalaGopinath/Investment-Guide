  <rect x="10" y="8" width="24" height="32" rx="1" ry="1" fill="#ffffff"/>
  <line x1="14" y1="16" x2="30" y2="16" stroke="#3f51b5" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="21" x2="30" y2="21" stroke="#3f51b5" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="26" x2="24" y2="26" stroke="#3f51b5" stroke-width="2" stroke-linecap="round"/>
  <!-- Rupee symbol accent -->
